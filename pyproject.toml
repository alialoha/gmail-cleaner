[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-cleaner"
version = "0.1.0"
description = "Multi-account Gmail storage cleaner with dry-run scans, confirm-to-trash, and run history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Gmail Cleaner Contributors" }]
keywords = ["gmail", "storage", "cleanup", "oauth", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "google-api-python-client>=2.120",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
]

[project.scripts]
gmail-cleaner = "gmail_cleaner.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_cleaner"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = [
  "/src/gmail_cleaner",
  "/README.md",
  "/LICENSE",
  "/config",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer Option()/Argument() defaults are intentional

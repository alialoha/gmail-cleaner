# Optional custom storage queries for mode=storage & location=all.
# Copy to ~/.gmail-cleaner/policy.yaml if you want to override defaults.
# Subscriptions mode and tab-scoped scans ignore this file and use built-in profiles.

version: 1

queries:
  - name: large_attachments
    q: "has:attachment larger:5M"
    enabled: true
  - name: huge_messages
    q: "larger:10M"
    enabled: true
  - name: old_promotions
    q: "category:promotions older_than:1y"
    enabled: true
  - name: old_social
    q: "category:social older_than:6m"
    enabled: true
  - name: spam
    q: "in:spam"
    enabled: true
  - name: trash
    q: "in:trash"
    enabled: true

ignore_senders: []
